---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ printf "%s-postgres" (include "shop-learn.fullname" . ) }}
  # Sealed for namespace shop-learn (strict scope) - chart installs there
  namespace: shop-learn
  labels:
    {{- include "shop-learn.labels" . | nindent 4 }}
spec:
  encryptedData:
    DATABASE_URL: 
    POSTGRES_PASSWORD: 
  template:
    metadata:
      name: shop-learn-postgres
      namespace: shop-learn
