apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  labels:
    {{- include "shop-learn.labels" . | nindent 4 }}
    app.kubernetes.io/component: orders
spec:
  replicas: {{ .Values.orders.replicaCount }}
  selector:
    matchLabels:
      {{- include "shop-learn.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: orders
  template:
    metadata:
      labels:
        {{- include "shop-learn.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: orders
    spec:
      containers:
        - name: orders
          image: "{{ .Values.orders.image.repository }}:{{ default .Values.image.tag .Values.orders.image.tag }}"
          imagePullPolicy: {{ .Values.orders.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.orders.service.port }}
          env:
            - name: PORT
              value: {{ .Values.orders.service.port | quote }}
            - name: PRODUCTS_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "shop-learn.fullname" . }}-config
                  key: PRODUCTS_URL
            {{- if .Values.kafka.enabled }}
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "shop-learn.fullname" . }}-config
                  key: KAFKA_BROKERS
            - name: KAFKA_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: {{ include "shop-learn.fullname" . }}-config
                  key: KAFKA_TOPIC
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.orders.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.orders.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: {{ .Values.orders.resources.limits.cpu | quote }}
              memory: {{ .Values.orders.resources.limits.memory | quote }}
            requests:
              cpu: {{ .Values.orders.resources.requests.cpu | quote }}
              memory: {{ .Values.orders.resources.requests.memory | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  labels:
    {{- include "shop-learn.labels" . | nindent 4 }}
    app.kubernetes.io/component: orders
spec:
  type: {{ .Values.orders.service.type }}
  ports:
    - port: {{ .Values.orders.service.port }}
      targetPort: {{ .Values.orders.service.port }}
      protocol: TCP
      name: http
  selector:
    {{- include "shop-learn.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: orders
