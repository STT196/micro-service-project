apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "shop-learn.fullname" . }}-gateway
  labels:
    {{- include "shop-learn.labels" . | nindent 4 }}
  annotations: {}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: {{ .Values.gateway.service.port }}
