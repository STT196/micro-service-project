{{- $secretName := printf "%s-postgres" (include "shop-learn.fullname" .) }}
{{- $pwd := include "shop-learn.postgresPassword" . | trim }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "shop-learn.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $pwd | quote }}
  DATABASE_URL: {{ printf "postgres://postgres:%s@postgres:5432/postgres" $pwd | quote }}
