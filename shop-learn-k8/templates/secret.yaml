{{- $secretName := printf "%s-postgres" (include "shop-learn.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $pwd := .Values.postgres.password | default "" }}
{{- if and (not $pwd) $existing }}
  {{- $pwd = index $existing.data "POSTGRES_PASSWORD" | b64dec }}
{{- else if not $pwd }}
  {{- $pwd = randAlphaNum 24 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "shop-learn.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $pwd | quote }}
